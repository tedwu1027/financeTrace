name: daily-report
on:
  schedule:
    # 14:30 UTC daily — ~22:30 Taipei, ~10:30 ET (after US cash open).
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: financetrace --site-dir site
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: reports/
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Resolve latest report metadata
        id: report
        run: |
          set -euo pipefail
          LATEST_HTML=$(ls -t reports/*.html 2>/dev/null | head -1)
          LATEST_JSON=$(ls -t reports/*.json 2>/dev/null | head -1)
          if [ -z "$LATEST_HTML" ] || [ -z "$LATEST_JSON" ]; then
            echo "no report files found" >&2
            exit 1
          fi
          VERDICT=$(jq -r '.verdict.label' "$LATEST_JSON")
          SCORE=$(jq -r '.verdict.score | tostring | .[:6]' "$LATEST_JSON")
          ASOF=$(jq -r '.asof' "$LATEST_JSON")
          CONTRIB=$(jq -r '"\(.verdict.contributing)/\(.verdict.total)"' "$LATEST_JSON")
          {
            echo "html=$LATEST_HTML"
            echo "json=$LATEST_JSON"
            echo "asof=$ASOF"
            echo "verdict=$VERDICT"
            echo "score=$SCORE"
            echo "contrib=$CONTRIB"
          } >> "$GITHUB_OUTPUT"

      - name: Email report
        if: env.GMAIL_USER != ''
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: financeTrace <${{ secrets.GMAIL_USER }}>
          to: tedwu1027@gmail.com
          subject: "financeTrace ${{ steps.report.outputs.asof }} — ${{ steps.report.outputs.verdict }} (${{ steps.report.outputs.score }})"
          html_body: file://${{ steps.report.outputs.html }}
          attachments: "${{ steps.report.outputs.html }},${{ steps.report.outputs.json }}"
          convert_markdown: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
